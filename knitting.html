  <h2>編物</h2>
  <p class="description">
    このカテゴリーでは、編物を通して得た視点や  
    ストーリー構造、思想を記録する。
  </p>

  <div class="entry">
    <h3>表編み・裏編み</h3>
    <p><strong>学んだこと</strong><br></p>
    <p>始める前は裏編みと表編みをYouTubeで確認したほうがいい。割とすぐ忘れる。</p>

    <p><strong>表編み</strong>:左手の糸を奥に設置する。左側から作り目の穴に入れて、糸を下から上にかける。</p>
    <p><strong>裏編み</strong>:左手の糸を手前に設置する。右側から作り目の穴に入れて、糸を上から下にかける。</p>

    <p><strong>考えたこと</strong><br></p>
    <p>編物は冬の前に作り始めるので忘れることが多い。特に裏編みは確認すること</p>
  </div>
